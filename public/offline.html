<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1714" />
    <title>Offline — A.S.G. Skate Guararema</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        --bg: #f5efe1;
        --ink: #1a1714;
        --rust: #c64b29;
        --amber: #e29d26;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-color: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #fffcf5;
        border: 3px solid var(--ink);
        border-radius: 8px;
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 5px 5px 0 var(--ink);
      }
      .logo {
        width: 84px;
        height: 84px;
        object-fit: contain;
        margin-bottom: 1rem;
      }
      .badge {
        display: inline-block;
        background: var(--amber);
        border: 1.5px solid var(--ink);
        padding: 0.2rem 0.65rem;
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.75rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.65rem;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 0.92rem;
        line-height: 1.5;
        color: #4b453d;
      }
      button {
        appearance: none;
        cursor: pointer;
        background: var(--rust);
        color: #fffcf5;
        border: 2px solid var(--ink);
        border-radius: 4px;
        padding: 0.65rem 1.25rem;
        font-weight: 800;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        box-shadow: 3px 3px 0 var(--ink);
      }
      button:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo-asg.png" alt="Logo A.S.G." class="logo" />
      <div><span class="badge">Sem conexão no momento</span></div>
      <h1>A.S.G. Skate App</h1>
      <p>
        Você está sem internet agora. Assim que a conexão voltar, atualize para acessar o ranking,
        álbuns de fotos e sua carteira de skatista ou associado.
      </p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
